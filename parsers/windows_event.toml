# Windows Event Log, the rendered XML form (`<Event xmlns='http://schemas.microsoft.com/
# win/2004/08/events/event'>`) that Windows Event Forwarding, wevtutil and the agents
# built on EvtRender hand on, one event per line. Endpoint telemetry, not a perimeter
# device: this family exists to show the format wall holds for a seventh strategy (D75).
#
# Sources, read 2026-09-06:
#  * Event Schema (learn.microsoft.com/en-us/windows/win32/wes/eventschema-schema): the
#    `Event` root, `System` (Provider Name/Guid, EventID, Version, Level, Task, Opcode,
#    Keywords, TimeCreated SystemTime, EventRecordID, Correlation, Execution
#    ProcessID/ThreadID, Channel, Computer, Security UserID) and `EventData` of
#    `<Data Name="...">` children; the Windows SDK ships it as Include\Event.xsd.
#  * 4624(S) An account was successfully logged on
#    (learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624):
#    the Event XML example and the EventData names SubjectUserSid, SubjectUserName,
#    SubjectDomainName, SubjectLogonId, TargetUserSid, TargetUserName, TargetDomainName,
#    TargetLogonId, LogonType, LogonProcessName, AuthenticationPackageName,
#    WorkstationName, LogonGuid, TransmittedServices, LmPackageName, KeyLength,
#    ProcessId, ProcessName, IpAddress, IpPort, ImpersonationLevel, RestrictedAdminMode,
#    TargetOutboundUserName, TargetOutboundDomainName, VirtualAccount,
#    TargetLinkedLogonId, ElevatedToken; the logon type table (2 Interactive, 3 Network,
#    4 Batch, 5 Service, 7 Unlock, 8 NetworkCleartext, 9 NewCredentials,
#    10 RemoteInteractive, 11 CachedInteractive, also 0 System, 12 and 13 cached forms).
#  * 4625(F) An account failed to log on (.../auditing/event-4625): the same names plus
#    Status, SubStatus, FailureReason; Status/SubStatus are NTSTATUS values
#    (0xc0000234 locked out, 0xc000006a bad password, 0xc0000064 no such user, ...).
#  * 4720(S) A user account was created (.../auditing/event-4720): TargetUserName,
#    TargetDomainName, TargetSid, Subject*, PrivilegeList, SamAccountName, DisplayName,
#    UserPrincipalName, HomeDirectory, HomePath, ScriptPath, ProfilePath,
#    UserWorkstations, PasswordLastSet, AccountExpires, PrimaryGroupId,
#    AllowedToDelegateTo, OldUacValue, NewUacValue, UserAccountControl, UserParameters,
#    SidHistory, LogonHours.
#  * Sysmon (learn.microsoft.com/en-us/sysinternals/downloads/sysmon, June 2026): event
#    id 1 Process creation, 3 Network connection, 11 FileCreate, their descriptions and
#    the filter tag names (ProcessCreate, NetworkConnect, FileCreate); the field names
#    (Image, CommandLine, ParentImage, ParentCommandLine, User, ProcessId, Hashes,
#    SourceIp, SourcePort, DestinationIp, DestinationPort, Protocol, TargetFilename,
#    CreationUtcTime, ...) are the ones `sysmon -s` prints, which the page describes.
#
# Field names are the XML's own: `System.EventID`, `System.Provider.Name`,
# `System.TimeCreated.SystemTime`, `EventData.<Data Name>` (docs/parser-format.md, xml).
# The `%%NNNN` values (ImpersonationLevel, FailureReason, UserAccountControl) are
# message-table references the renderer did not resolve; they stay as written.

[parser]
name = "windows_event"
vendor = "Microsoft"
product = "Windows Event Log"
description = "Windows Event Log XML (Security auditing 4624/4625/4720, Sysmon 1/3/11)"

# A forwarder that wraps the XML in a syslog line (NXLog, the Windows Event Forwarding to
# syslog agents) still matches, so the envelope is stripped before the document is read.
[envelope]
syslog = true

[match]
contains = ["<Event xmlns=", "schemas.microsoft.com/win/2004/08/events/event"]

[strategy]
kind = "xml"

# TimeCreated is the event's own clock in UTC with up to seven fractional digits.
[[timestamp]]
field = "System.TimeCreated.SystemTime"
format = "rfc3339"

# The subs add the documented event name and audit subcategory; the pattern only checks
# the id is a number and emits no field. `audit_result` is the S/F of the page title.
[[sub]]
field = "System.EventID"
when = { "System.EventID" = "4624", "System.Provider.Name" = "Microsoft-Windows-Security-Auditing" }
kind = "pattern"
pattern = "{_:int}"
anchor = "full"
constants = { event_name = "An account was successfully logged on", audit_subcategory = "Audit Logon", audit_result = "Success" }

[[sub]]
field = "System.EventID"
when = { "System.EventID" = "4625", "System.Provider.Name" = "Microsoft-Windows-Security-Auditing" }
kind = "pattern"
pattern = "{_:int}"
anchor = "full"
constants = { event_name = "An account failed to log on", audit_subcategory = "Audit Logon", audit_result = "Failure" }

[[sub]]
field = "System.EventID"
when = { "System.EventID" = "4720", "System.Provider.Name" = "Microsoft-Windows-Security-Auditing" }
kind = "pattern"
pattern = "{_:int}"
anchor = "full"
constants = { event_name = "A user account was created", audit_subcategory = "Audit User Account Management", audit_result = "Success" }

[[sub]]
field = "System.EventID"
when = { "System.EventID" = "1", "System.Provider.Name" = "Microsoft-Windows-Sysmon" }
kind = "pattern"
pattern = "{_:int}"
anchor = "full"
constants = { event_name = "Process creation", task_name = "ProcessCreate" }

[[sub]]
field = "System.EventID"
when = { "System.EventID" = "3", "System.Provider.Name" = "Microsoft-Windows-Sysmon" }
kind = "pattern"
pattern = "{_:int}"
anchor = "full"
constants = { event_name = "Network connection", task_name = "NetworkConnect" }

[[sub]]
field = "System.EventID"
when = { "System.EventID" = "11", "System.Provider.Name" = "Microsoft-Windows-Sysmon" }
kind = "pattern"
pattern = "{_:int}"
anchor = "full"
constants = { event_name = "File created", task_name = "FileCreate" }
