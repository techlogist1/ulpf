# SonicWall SonicOS enhanced syslog: key=value after <pri>, usually with no RFC 3164
# header (relays may add one). Source: SonicOS Log Events Reference Guide and captured
# SonicOS 6/7 lines (2026-09-05 review). src/dst pack ip:port:interface[:hostname], the
# interface may carry a VLAN suffix (X0-V30), and drop messages may give a bare address;
# proto packs transport/service.

[parser]
name = "sonicwall"
vendor = "SonicWall"
product = "SonicOS"

[match]
contains = ["id=firewall", "sn="]

[envelope]
syslog = true

[strategy]
kind = "kv"
key_value_separator = "="
pair_separator = " "
quote = '"' 

[[timestamp]]
field = "time"
format = "%Y-%m-%d %H:%M:%S %Z"

[[timestamp]]
field = "time"
format = "%Y-%m-%d %H:%M:%S"

# src/dst are the colon-joined address, port, interface and (with a resolved name)
# hostname. SonicOS writes the separators whether or not it has the part: a management
# hit has no interface (`10.0.0.1:51692`), an admin session no port
# (`10.0.0.1::X0`), and a v6 flow carries the address in srcV6/dstV6 and leaves the v4
# slot empty (`:28503:WAN:HOST`, `::LAN:HOST`). Each part is therefore an optional
# group: a part the device left empty is the absence of that field, not a mis-split
# value.
[[sub]]
field = "src"
kind = "pattern"
anchor = "full"
patterns = [
  '{?{src_ip:ip}}:{?{src_port:int}}:{?{src_interface:text}}:{src_host:rest}',
  '{?{src_ip:ip}}:{?{src_port:int}}:{src_interface:rest}',
  '{?{src_ip:ip}}:{src_port:int}',
  '{src_ip:ip}',
]

[[sub]]
field = "dst"
kind = "pattern"
anchor = "full"
patterns = [
  '{?{dst_ip:ip}}:{?{dst_port:int}}:{?{dst_interface:text}}:{dst_host:rest}',
  '{?{dst_ip:ip}}:{?{dst_port:int}}:{dst_interface:rest}',
  '{?{dst_ip:ip}}:{dst_port:int}',
  '{dst_ip:ip}',
]

[[sub]]
field = "proto"
kind = "pattern"
anchor = "full"
patterns = [
  '{protocol:word}/{service:word}',
  '{protocol:word}',
]
