# OpenVPN server/client file log (--log / --log-append, verb 3): a timestamp, then
# either nothing (daemon lines), "ip:port" (peer before authentication), "cn/ip:port"
# (peer after authentication) or "ip:port [cn]" while the client instance is being named.
# Sources: OpenVPN 2.6 reference manual (--log, --verb) and the message strings in
# openvpn/src/openvpn: socket.c, ssl.c, ssl_verify*.c, multi.c, crypto.c, ping.c, sig.c,
# forward.c, push.c, misc.c, tun.c, init.c (checked 2026-09-05).
# THREE wire forms, one message vocabulary.
#  1. `--log`/`--log-append` up to and including 2.4 writes the C `ctime()` stamp
#     ("Sat Sep  5 10:14:21 2026 ").
#  2. `--log`/`--log-append` from 2.5 writes ISO 8601 instead. OpenVPN's own Changes.rst
#     for 2.5: "use ISO 8601 time format for file based logging now (YYYY-MM-DD
#     hh:mm:dd) (syslog is not affected, nor is --machine-readable-output)". Both
#     generations are in the field, so both are matched; neither stamp carries a zone.
#  3. `--syslog` (and every distro's packaged unit, which daemonises) hands the same
#     message body to the system logger, which prepends its own RFC 3164 header and the
#     daemon's program name as the syslog tag. `--daemon [progname]`/`--syslog
#     [progname]` set that name ("openvpn" by default; Debian/Ubuntu's openvpn-server@
#     unit uses ovpn-<instance>), so the tag is matched as o[pen]vpn* with an optional
#     [pid].
# Detection is one of those three prefixes. Form 2 is the weak one: "YYYY-MM-DD
# HH:MM:SS " at the start of a line is a shape, not a vendor mark, and nothing else in
# an OpenVPN log line is constant. `priority = -1` keeps this definition below every
# other, so it only ever claims a line no vendor-marked parser wanted, and the
# alternative -- leaving the whole 2.5+ file form at no_parser -- is worse: it is the
# default log of the current release.

[parser]
name = "openvpn"
vendor = "OpenVPN"
product = "OpenVPN"

[match]
regex = '^(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) [A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4} |^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} |\bo(?:pen)?vpn[-_A-Za-z0-9]*(?:\[[0-9]+\])?: '
priority = -1

# Strips the header the system logger added on the --syslog path. A ctime line starts
# with a weekday, which is not an RFC 3164 timestamp, so the file form is left whole.
[envelope]
syslog = true

[strategy]
kind = "pattern"
patterns = [
  '{timestamp:timestamp} {user:word}/{peer_ip:ip}:{peer_port:port} [{_:text}] {message:rest}',
  '{timestamp:timestamp} {user:word}/{peer_ip:ip}:{peer_port:port} {message:rest}',
  '{timestamp:timestamp} {peer_ip:ip}:{peer_port:port} [{user:text}] {message:rest}',
  '{timestamp:timestamp} {peer_ip:ip}:{peer_port:port} {message:rest}',
  '{timestamp:timestamp} {message:rest}',
  '{syslog_tag:word}: {user:word}/{peer_ip:ip}:{peer_port:port} [{_:text}] {message:rest}',
  '{syslog_tag:word}: {user:word}/{peer_ip:ip}:{peer_port:port} {message:rest}',
  '{syslog_tag:word}: {peer_ip:ip}:{peer_port:port} [{user:text}] {message:rest}',
  '{syslog_tag:word}: {peer_ip:ip}:{peer_port:port} {message:rest}',
  '{syslog_tag:word}: {message:rest}',
]

# Neither file-log stamp carries a zone -- OpenVPN formats local time with no offset in
# both generations -- so the server's local zone is assumed (--tz on the CLI). Candidates
# are tried in order and both read the same slot. On the syslog path there is no device
# stamp in the body, so the envelope's header time is the automatic fallback.
[[timestamp]]
field = "timestamp"
format = "ctime"

[[timestamp]]
field = "timestamp"
format = "%Y-%m-%d %H:%M:%S"

[[sub]]
field = "message"
kind = "pattern"
pattern = 'Peer Connection Initiated with [{address_family:word}]{remote_ip:ip}:{remote_port:port}'
constants = { vpn_event = "connection_initiated", action = "connected" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'TLS: Initial packet from [{address_family:word}]{remote_ip:ip}:{remote_port:port}{_:rest}'
constants = { vpn_event = "tls_initial_packet" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'VERIFY OK: depth={cert_depth:int}, {cert_subject:rest}'
constants = { vpn_event = "certificate_verified" }

# OpenSSL builds append ", serial=..."; mbedTLS builds order the parts differently.
[[sub]]
field = "message"
kind = "pattern"
patterns = [
  'VERIFY ERROR: depth={cert_depth:int}, error={reason:text}: {cert_subject:text}, serial={cert_serial:rest}',
  'VERIFY ERROR: depth={cert_depth:int}, subject={cert_subject:text}, serial={cert_serial:text}: {reason:rest}',
  'VERIFY ERROR: depth={cert_depth:int}, error={reason:text}: {cert_subject:rest}',
]
constants = { vpn_event = "certificate_rejected", action = "failed" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'TLS Auth Error: {reason:rest}'
constants = { vpn_event = "auth_failed", action = "failed" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'TLS Error: {reason:rest}'
constants = { vpn_event = "tls_failed", action = "failed" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'MULTI_sva: pool returned IPv4={assigned_ip:text}, IPv6={assigned_ipv6:rest}'
constants = { vpn_event = "address_assigned" }

[[sub]]
field = "message"
kind = "pattern"
patterns = [
  'MULTI: Learn: {learned_ip:ip} -> {_:rest}',
  'MULTI: Learn sec: {learned_ip:ip} -> {_:rest}',
]
constants = { vpn_event = "route_learned" }

[[sub]]
field = "message"
kind = "pattern"
patterns = [
  "Outgoing Data Channel: Cipher '{cipher:text}' initialized with {key_bits:int} bit key",
  "Data Channel Encrypt: Cipher '{cipher:text}' initialized with {key_bits:int} bit key",
]
constants = { vpn_event = "cipher_negotiated" }

# The same event under 2.6's name: the per-key "Cipher ... initialized" lines were
# replaced by one summary line built in init.c as
#   buf_printf(&out, "Data Channel: cipher '%s'", ...)            (AEAD)
#   buf_printf(&out, "Data Channel: cipher '%s', auth '%s'", ...) (non-AEAD)
# with ", peer-id: %d" appended when the session has a peer id. Longest form first
# because the default `start` anchor lets a shorter pattern stop early.
[[sub]]
field = "message"
kind = "pattern"
patterns = [
  "Data Channel: cipher '{cipher:text}', auth '{auth_digest:text}', peer-id: {peer_id:int}",
  "Data Channel: cipher '{cipher:text}', auth '{auth_digest:text}'",
  "Data Channel: cipher '{cipher:text}', peer-id: {peer_id:int}",
  "Data Channel: cipher '{cipher:text}'",
]
constants = { vpn_event = "cipher_negotiated" }

# print_details() in ssl_openssl.c / ssl_mbedtls.c: msg(D_HANDSHAKE, "%s%s%s", s1, s2, s3)
# where s1 = "%s %s, cipher %s %s" (prefix "Control Channel:", TLS version, cipher
# suite), s2 = ", peer certificate: %s%s" (the signature part is the second %s) and
# s3 = ", peer temporary key: %s". s2 and s3 are absent when there is no peer
# certificate or no ephemeral key, so the shorter forms are real, not truncation.
[[sub]]
field = "message"
kind = "pattern"
patterns = [
  'Control Channel: {tls_version:text}, cipher {cipher_suite:text}, peer certificate: {peer_certificate:text}, signature: {peer_certificate_signature:text}, peer temporary key: {peer_temporary_key:rest}',
  'Control Channel: {tls_version:text}, cipher {cipher_suite:text}, peer certificate: {peer_certificate:rest}',
  'Control Channel: {tls_version:text}, cipher {cipher_suite:rest}',
]
constants = { vpn_event = "tls_established" }

# multi.c, verbatim: "MULTI: new connection by client '%s' will cause previous active
# sessions by this client to be dropped.  Remember to use the --duplicate-cn option
# ...". The certificate CN is the identity, so it is `user` like everywhere else here.
[[sub]]
field = "message"
kind = "pattern"
pattern = "MULTI: new connection by client '{user:text}' will cause previous active sessions by this client to be dropped."
constants = { vpn_event = "duplicate_cn" }

# crypto.c: `static const char error_prefix[] = "Authenticate/Decrypt packet error";`
# then `crypto_msg(D_CRYPT_ERRORS, "%s: %s", error_prefix, reason)`. A packet that fails
# the HMAC is an unauthenticated peer, not a protocol nicety.
[[sub]]
field = "message"
kind = "pattern"
pattern = 'Authenticate/Decrypt packet error: {reason:rest}'
constants = { vpn_event = "packet_auth_failed", action = "failed" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'Inactivity timeout ({_:text}), restarting'
constants = { vpn_event = "inactivity_timeout" }

[[sub]]
field = "message"
kind = "pattern"
pattern = '{signal:word}[{signal_detail:text}] received, client-instance {_:rest}'
constants = { vpn_event = "disconnected", action = "disconnected" }

# The daemon's own signals name the process, not a client instance.
[[sub]]
field = "message"
kind = "pattern"
pattern = '{signal:word}[{signal_detail:text}] received, {signal_scope:text} {_:rest}'
constants = { vpn_event = "signal" }

[[sub]]
field = "message"
kind = "pattern"
patterns = [
  'MULTI: primary virtual IP for {_:text}: {assigned_ip:ip}',
  'MULTI: primary virtual IPv6 for {_:text}: {assigned_ipv6:rest}',
]
constants = { vpn_event = "primary_virtual_ip" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'peer info: {peer_info:rest}'
constants = { vpn_event = "peer_info" }

[[sub]]
field = "message"
kind = "pattern"
pattern = "PUSH: Received control message: '{push_message:text}'"
constants = { vpn_event = "push_request" }

[[sub]]
field = "message"
kind = "pattern"
pattern = "SENT CONTROL [{_:text}]: '{push_reply:text}' (status={push_status:int})"
constants = { vpn_event = "push_reply" }

[[sub]]
field = "message"
kind = "pattern"
pattern = 'Delayed exit in {delay_seconds:int} seconds'
constants = { vpn_event = "delayed_exit" }

# Daemon lines (no peer): version banner, tunnel device, ready.
[[sub]]
field = "message"
kind = "pattern"
patterns = [
  'OpenVPN {daemon_version:word} {build_info:rest}',
  'TUN/TAP device {tun_device:word} opened',
  'Initialization Sequence Completed',
]
constants = { vpn_event = "daemon" }
