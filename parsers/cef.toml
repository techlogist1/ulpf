# ArcSight Common Event Format (CEF): the generic container any CEF-speaking device
# fills. Source: Micro Focus / OpenText ArcSight SmartConnectors 8.4, "CEF Implementation
# Standard" (Implementing ArcSight Common Event Format), chapter 1 "What is CEF?" and
# chapter 2 "ArcSight Extension Dictionary", microfocus.com/documentation/arcsight/
# arcsight-smartconnectors-8.4/cef-implementation-standard/ (pages carry no revision
# date), fetched 2026-09-06.
# Header, verbatim: `CEF:Version|Device Vendor|Device Product|Device Version|Device Event
# Class ID|Name|Severity|[Extension]`, optionally behind a syslog prefix (`Sep 19 08:26:10
# host CEF:0|...`). Escaping: a pipe in the header is `\|`; a backslash anywhere is `\\`;
# an equals sign in an extension value is `\=`; pipes in the extension need no escape.
# The strategy names the seven header fields cef_version, device_vendor, device_product,
# device_version, signature_id, name, severity and emits every extension key as written
# (src, dst, spt, dpt, proto, act, suser, duser, dvchost, dvc, rt, msg, request,
# requestMethod, requestClientApplication, app, in, out, cat, cs1..cs6 + cs1Label..,
# deviceDirection (0 inbound, 1 outbound), outcome, reason, shost, dhost, smac, dmac,
# deviceInboundInterface, deviceOutboundInterface, start, end, cnt, fname, fsize).
# Time: rt (deviceReceiptTime) "is MMM dd yyyy HH:mm:ss or milliseconds since epoch";
# epoch first, then the textual layout (read by `auto`: the syslog shape with a year,
# tolerating the fraction or zone a connector may append), then the syslog header.
# CEF severity is 0-10 (0-3 Low, 4-6 Medium, 7-8 High, 9-10 Very-High); the mapping's
# numeric severity table is the syslog 0-7 scale, so a numeric CEF severity is
# canonicalised on the wrong scale (see mappings/ocsf.toml, [[enum]] severity).
# Priority 0 beside the vendor parsers: the matcher needs the format's own header before
# any pipe, which no vendor sample carries. A definition for a specific CEF-speaking
# device that adds subs must declare `priority = 1` to take its lines from this one.

[parser]
name = "cef"
vendor = "ArcSight"
product = "Common Event Format"
description = "Generic CEF container: header fields plus every extension key as written"

[match]
contains = ["CEF:"]
regex = '^[^|]*CEF:[0-9]+\|'

[envelope]
syslog = true

[strategy]
kind = "cef"

[[timestamp]]
field = "rt"
format = "epoch_ms"

[[timestamp]]
field = "rt"
format = "auto"
