# Fortinet FortiGate syslog in the default key=value format.
# Sources: FortiOS Log Reference (traffic / utm / event log fields).
# Values may be quoted or bare; msg="..." may contain spaces and escaped quotes.
# FortiOS renamed the identity keys at 5.0: `device_id=`/`log_id=` became
# `devid=`/`logid=`, and the traffic keys `src`/`dst`/`src_int`/`dst_int`/`status`
# became `srcip`/`dstip`/`srcintf`/`dstintf`/`action`. The strategy is key=value and
# carries whatever names the device wrote, so both generations parse; the matcher
# accepts either spelling of the log id rather than leaving a real FortiGate at
# no_parser (where inference would propose a competing generated definition). The
# pre-5.0 traffic key names then show up as unmapped_fields, which is the honest
# signal: the gap is in the mapping, not in the parse.

[parser]
name = "fortinet_fortigate"
vendor = "Fortinet"
product = "FortiGate"

[match]
contains = ["devname="]
regex = 'log_?id='

[envelope]
syslog = true

[strategy]
kind = "kv"
key_value_separator = "="
pair_separator = " "
quote = '"'

# eventtime is epoch nanoseconds on FortiOS 6.2+ and epoch seconds on 6.0; "auto"
# picks the unit by magnitude. date/time/tz are the fallback for older firmware.
[[timestamp]]
field = "eventtime"
format = "auto"

[[timestamp]]
fields = ["date", "time", "tz"]
format = "%Y-%m-%d %H:%M:%S %z"

[[timestamp]]
fields = ["date", "time"]
format = "%Y-%m-%d %H:%M:%S"
