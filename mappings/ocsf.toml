# OCSF pragmatic subset. Source-field vocabulary only: no vendor or parser names appear
# here, and the loader rejects any key it does not know. Teammates may add a fragment
# file (mappings/ocsf.<anything>.toml) with the same [schema] name; fragments merge.

[schema]
name = "ocsf"
version = "1.3.0"

# The five schema paths the pivot index groups events by. Kinds are fixed; the paths are
# this schema's business, so the index never learns a vendor field name. `device` falls
# back to the ingest source name when the path is absent from an event.
[entities]
src_ip = "src_endpoint.ip"
dst_ip = "dst_endpoint.ip"
user = "user.name"
dst_port = "dst_endpoint.port"
device = "device.hostname"

# Source values that mean "nothing here". Dropped before mapping, never in `unmapped`.
[values]
absent = ["", "-", "N/A", "n/a", "(none)", "(Not enabled)", "0.0.0.0"]

[fields]
"src_endpoint.ip" = ["srcip", "src_ip", "src", "sourceip", "attacker", "source_ip", "source_address", "source-address", "srcaddr", "SourceIP", "client_ip", "c-ip", "shost_ip", "remote_ip", "peer_ip", "peer_addr", "ip_src", "sourceIPAddress", "id_orig_h"]
"src_endpoint.port" = ["srcport", "src_port", "spt", "source_port", "source-port", "SourcePort", "sport", "s_port", "client_port", "peer_port", "src_port_num", "srcPort", "id_orig_p"]
"src_endpoint.interface_name" = ["srcintf", "src_interface", "in_interface", "in_intf", "inbound_if", "packet-incoming-interface", "source-interface-name", "deviceInboundInterface", "inif", "src_zone_interface"]
"src_endpoint.zone" = ["srczone", "srcZone", "src_zone", "source-zone-name", "inzone", "inzone_name", "src_zone_name", "from_zone"]
"src_endpoint.location.country" = ["srccountry", "src_country", "srcloc", "SourceCountry"]
"src_endpoint.mac" = ["srcmac", "src_mac", "smac", "srcMac", "source_mac", "srcMAC"]
"src_endpoint.hostname" = ["srcname", "src_host", "src_machine_name", "shost", "source_host", "client_name"]
"src_endpoint.svc_name" = ["src_service", "sproc"]
"dst_endpoint.ip" = ["dstip", "dst_ip", "dst", "victim", "destination_ip", "destination_address", "destination-address", "dstaddr", "DestinationIP", "server_ip", "dest_ip", "ip_dst", "assigned_ip", "remote_ip_dst", "id_resp_h"]
"dst_endpoint.port" = ["dstport", "dst_port", "dpt", "destination_port", "destination-port", "DestinationPort", "dport", "d_port", "server_port", "dest_port", "dst_port_num", "dstPort", "id_resp_p"]
"dst_endpoint.interface_name" = ["dstintf", "dst_interface", "out_interface", "out_intf", "outbound_if", "destination-interface-name", "deviceOutboundInterface", "outif", "dst_zone_interface"]
"dst_endpoint.zone" = ["dstzone", "dstZone", "dst_zone", "destination-zone-name", "outzone", "outzone_name", "dst_zone_name", "to_zone"]
"dst_endpoint.location.country" = ["dstcountry", "dst_country", "dstloc", "DestinationCountry"]
"dst_endpoint.mac" = ["dstmac", "dst_mac", "dmac", "dstMac", "destination_mac", "dstMAC"]
"dst_endpoint.hostname" = ["dstname", "dst_host", "dst_machine_name", "dhost", "destination_host", "server_name", "server_host", "hostname_dst"]
"dst_endpoint.svc_name" = ["service_id", "service", "dst_service", "service-name", "dproc"]
"connection_info.protocol_name" = ["protocol", "proto", "Protocol", "protocol-id", "protocol-name", "protocol_id", "transport", "ip_proto", "proto_name", "IPProtocol"]
"connection_info.direction" = ["direction", "ifdir", "conn_direction", "Direction", "flow_direction", "deviceDirection"]
"connection_info.uid" = ["sessionid", "connection_id", "session_id", "session-id-32", "flow_id", "conn_id", "flowid", "session", "uid"]
"connection_info.tcp_flags" = ["tcpflags", "tcp_flags"]
"connection_info.community_uid" = ["community_id"]
"action" = ["action", "act", "utmaction", "disposition", "Action", "verdict", "filter_action", "fw_action", "result_action", "rule_action", "alert.action", "cache_status", "status"]
"severity" = ["severity", "level", "priority", "pri", "crlevel", "threat-severity", "alert.severity", "ipspri", "Severity", "syslog_severity", "sev"]
