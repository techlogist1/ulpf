# The bare digits are the syslog scale (0 emergency .. 7 debug). LEEF `sev` is 1-10 with
# 10 the most severe, bucketed by field below. CEF's header `severity` is 0-10 the same
# way up, but it arrives under the name `severity` that syslog-scaled devices use too, so
# a numeric CEF severity is read on the syslog scale (see parsers/cef.toml).
[[enum]]
field = "severity"
id_field = "severity_id"
unknown = { value = "Unknown", id = 0 }
other = { value = "Other", id = 99 }

[[enum.values]]
value = "Informational"
id = 1
raw = ["informational", "information", "info", "notice", "debug", "debugging", "6", "7", "5", "verbose", "low-info"]
raw_by_field = { "alert.severity" = ["4"], "ipspri" = ["3"], "sev" = ["1", "2"] }

[[enum.values]]
value = "Low"
id = 2
raw = ["low", "minor", "warning", "warn", "4"]
raw_by_field = { "alert.severity" = ["3"], "ipspri" = ["2"], "sev" = ["3", "4"] }

[[enum.values]]
value = "Medium"
id = 3
raw = ["medium", "med", "moderate", "error", "err", "3"]
raw_by_field = { "alert.severity" = ["2"], "sev" = ["5", "6"] }

[[enum.values]]
value = "High"
id = 4
raw = ["high", "major", "critical-low", "2", "crit"]
raw_by_field = { "alert.severity" = ["1"], "ipspri" = ["1"], "sev" = ["7", "8"] }

[[enum.values]]
value = "Critical"
id = 5
raw = ["critical", "1", "alert", "severe"]
raw_by_field = { "sev" = ["9", "10"] }

[[enum.values]]
value = "Fatal"
id = 6
raw = ["0", "emergency", "emerg", "fatal", "panic"]

[[enum]]
field = "connection_info.protocol_name"
id_field = "connection_info.protocol_num"
other = { value = "Other" }

[[enum.values]]
value = "tcp"
id = 6
raw = ["tcp", "6", "tcp/ip"]

[[enum.values]]
value = "udp"
id = 17
raw = ["udp", "17"]

[[enum.values]]
value = "icmp"
id = 1
raw = ["icmp", "1", "ping"]

[[enum.values]]
value = "ipv6-icmp"
id = 58
raw = ["icmpv6", "ipv6-icmp", "icmp6", "58"]

[[enum.values]]
value = "gre"
id = 47
raw = ["gre", "47"]

[[enum.values]]
value = "esp"
id = 50
raw = ["esp", "50"]

[[enum.values]]
value = "ah"
id = 51
raw = ["ah", "51"]

[[enum.values]]
value = "sctp"
id = 132
raw = ["sctp", "132"]

[[enum.values]]
value = "igmp"
id = 2
raw = ["igmp", "2"]

[[enum.values]]
value = "carp"
id = 112
raw = ["carp", "vrrp", "112"]

[[enum.values]]
value = "ip"
id = 0
raw = ["ip", "ipv4", "ipv6", "0", "41"]

[[enum]]
