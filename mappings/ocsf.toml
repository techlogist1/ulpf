# Cloud API audit records. `readOnly` is the record's own statement that the operation
# reads (OCSF activity Read); a write is Create, Update or Delete and the record does not
# say which, so the second rule carries the class only and no activity.
[[class]]
uid = 6003
name = "API Activity"
category_uid = 6
category_name = "Application Activity"
constants = { activity_id = 2, activity_name = "Read" }
when = [
  { readOnly = ["true"], eventSource = ["*"], eventName = ["*"] },
]

[[class]]
uid = 6003
name = "API Activity"
category_uid = 6
category_name = "Application Activity"
when = [
  { eventSource = ["*"], eventName = ["*"] },
]

