"type_name" = ["type", "log_type", "logtype", "subtype", "log_subtype", "event_type", "log_component", "record_type", "event_kind", "vpn_event", "eventType"]

# --- cloud API audit records (the names a json strategy flattens with dots) ----------
# actor.* rather than user.*: API Activity's caller is the actor object, so the pivot's
# `user` kind (user.name) does not see these callers.
"actor.user.name" = ["userIdentity.userName"]
"actor.user.uid" = ["userIdentity.arn"]
"actor.user.type" = ["userIdentity.type"]
"actor.user.account.uid" = ["userIdentity.accountId"]
"actor.session.issuer" = ["userIdentity.sessionContext.sessionIssuer.arn"]
"actor.session.credential_uid" = ["userIdentity.accessKeyId"]
