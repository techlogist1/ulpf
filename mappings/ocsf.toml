"finding_info.uid" = ["attackid", "alert.signature_id", "signature_id", "threat_id", "sid", "sig_id", "ips_id", "protection_id"]
"finding_info.types" = ["eventtype", "attack_category", "alert.category", "threat_category", "thr_category", "ipscat", "protection_type", "category", "class"]
"finding_info.desc" = ["alert.metadata", "attack_info", "malware_action", "threat_desc", "vuln_desc"]
"http_request.url.text" = ["url", "request_url", "requestUrl", "uri", "request_uri", "http.url", "resource", "cs-uri", "URL", "request"]
"http_request.url.hostname" = ["http.hostname", "hostname_http", "http_host", "domain", "cs-host", "site", "request_host"]
"http_request.http_method" = ["method", "request_method", "requestMethod", "http_method", "cs-method", "http.http_method"]
"http_request.user_agent" = ["user_agent", "agent", "requestClientApplication", "cs(User-Agent)", "http.http_user_agent", "ua", "userAgent"]
"http_request.referrer" = ["referer", "referrer", "requestContext", "http.http_refer", "cs(Referer)"]
"http_response.code" = ["status_code", "http_status", "response_code", "httpresponsecode", "code", "sc-status", "http.status", "http_code", "http_response_code"]
"http_response.content_type" = ["content_type", "contenttype", "mime_type", "http.http_content_type", "sc-content-type"]
"tls.sni" = ["sni", "tls.sni", "server_name_indication"]
"tls.version" = ["tls_version", "tls.version", "ssl_version", "tlsDetails.tlsVersion"]
