"firewall_rule.name" = ["policyname", "rule_name", "acl", "access_list", "rule", "policy_name", "policy-name", "fw_rule_name", "rulename", "acl_name", "filter_name"]
"firewall_rule.uid" = ["policyid", "rule_id", "fw_rule_id", "ruleid", "rule_uid", "rule_uuid", "policy_id", "tracker", "rulenum", "policy_uid"]
"app_name" = ["app", "application", "appcat", "app_name", "appi_name", "application_name", "application-name", "app_proto", "appName", "service_name", "app_category"]
"user.name" = ["user", "usrName", "usr", "suser", "srcuser", "src_user_name", "user_name", "username", "duser", "src_user", "userName", "login", "common_name", "cn", "auth_user", "remote_user", "admin"]
"user.domain" = ["user_domain", "realm", "group", "group_name", "user_gp", "usergroupname", "roles"]
"message" = ["msg", "message", "logdesc", "raw_message", "description", "opaque", "event_description", "log_message", "text", "content"]
