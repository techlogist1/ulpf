"api.service.name" = ["eventSource"]
"api.request.uid" = ["requestID"]
"api.response.error" = ["errorCode"]
"api.response.error_message" = ["errorMessage"]

[types]
int = [
  "src_endpoint.port", "dst_endpoint.port", "traffic.bytes_in", "traffic.bytes_out",
  "traffic.packets_in", "traffic.packets_out", "traffic.bytes", "traffic.packets",
  "http_response.code", "connection_info.uid", "finding_info.uid", "firewall_rule.uid",
  "duration",
]

