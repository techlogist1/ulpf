"dns_query.hostname" = ["qname", "dns.rrname", "dns.queries.0.rrname", "query", "dns_query", "domain_name", "qry_name"]
"dns_query.type" = ["qtype", "dns.rrtype", "dns.queries.0.rrtype", "query_type", "qry_type"]
"metadata.event_code" = ["msg_id", "logid", "event_id", "eventid", "message_id", "signature_id_header", "mnemonic", "log_id", "msgid", "m", "code_id", "syslog_msgid"]
"metadata.log_level" = ["log_level", "loglevel"]
"metadata.uid" = ["uuid", "event_uid", "record_id", "eventuuid", "loguid", "poluuid", "eventID"]
