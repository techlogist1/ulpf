[parser]
name = "mikrotik_inferred"
vendor = "unknown"
product = "mikrotik.log"
description = "Inferred from 250 unknown lines of mikrotik.log; review every slot name before trusting."

[match]
regex = "(?:firewall,info input: in:|firewall,info forward: in:|system,error,critical login failure for user|system,info,account user|script,info script|wireless,info|dhcp,info)"
priority = -1

[envelope]
syslog = true

[strategy]
kind = "pattern"
patterns = ["firewall,info input: in:{in:word} out:(none), src-mac {src_mac:mac}, proto ICMP (type={type:int}, code={code:int}), {ip1:ip}->{ip2:ipv4}, len {len:int}", "firewall,info forward: in:{in:word} out:{out:word}, src-mac {src_mac:mac}, proto UDP ({int1:int}), {ip1:ipv4}:{port1:port}->{ip2:ipv4}:{port2:port}, {?NAT ({ip3:ipv4}:{port3:port}->{ip4:ipv4}:{port4:port})->{ip5:ipv4}:{port5:port}, }len {len:int}", "firewall,info input: in:{in:word} out:(none), src-mac {src_mac:mac}, proto UDP ({int1:int}), {ip1:ip}:{port1:port}->{ip2:ipv4}:{port2:port}{?, len {len:int}}", "firewall,info input: in:{in:word} out:(none), src-mac {src_mac:mac}, proto TCP {word1:word}, {ip1:ip}:{port1:port}->{ip2:ipv4}:{port2:port}{?, len {len:int}}", "firewall,info forward: in:{in:word} out:{out:word}, src-mac {src_mac:mac}, proto TCP {word1:word}, {ip1:ipv4}:{port1:port}->{ip2:ipv4}:{port2:port}, {?NAT ({ip3:ipv4}:{port3:port}->{ip4:ipv4}:{port4:port})->{ip5:ipv4}:{port5:port}, }len {len:int}", "system,error,critical login failure for user {?{user:word} }from {from:ip} via {via:word}", "system,info,account user {user:word} logged out from {from:ip} via {via:word}", "system,info,account user {user:word} logged in from {from:ip} via {via:word}", "script,info script {word1:word} started by scheduler", "wireless,info {mac1:mac}@{word1:word}: disconnected, {text1:text}{? is lost}", "wireless,info {mac1:mac}@{word1:word}: connected", "dhcp,info {word1:word} deassigned {ip1:ipv4} from {from:mac}", "dhcp,info {word1:word} assigned {ip1:ipv4} to {to:mac}"]
