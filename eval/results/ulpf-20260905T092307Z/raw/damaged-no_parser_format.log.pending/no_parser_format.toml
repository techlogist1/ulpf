[parser]
name = "no_parser_format_inferred"
vendor = "unknown"
product = "no_parser_format.log"
description = "Inferred from 50 unknown lines of no_parser_format.log; review every slot name before trusting."

[match]
contains = ["PROPRIETARY-WIDGETFW"]
priority = -1

[envelope]
syslog = false

[strategy]
kind = "pattern"
patterns = ["<PROPRIETARY-WIDGETFW>{timestamp:timestamp} host={host:word} code={code:int} verdict=OPAQUE</PROPRIETARY-WIDGETFW>"]

[[timestamp]]
field = "timestamp"
format = "auto"
