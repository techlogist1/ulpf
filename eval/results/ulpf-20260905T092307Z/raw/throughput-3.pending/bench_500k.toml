[parser]
name = "bench_500k_inferred"
vendor = "unknown"
product = "bench-500k.log"
description = "Inferred from 4096 unknown lines of bench-500k.log; review every slot name before trusting."

[match]
regex = "(?:garbage line that is not an access log entry|another line no parser claims|Thu Sep|Thu Se)"
priority = -1

[envelope]
syslog = false

[strategy]
kind = "pattern"
patterns = ["garbage line that is not an access log entry", "another line no parser claims", "Thu Sep {?{int1:int} }{?{int2:int}}{?:}{?{int3:int}}{?:}", "Thu Se", "<{int1:int}>{word1:word}{? }{?{word2:word}}{? }{?{int2:int}}{?:}{? }{?{word3:word}}{?Sep }{?{int3:int} {int4:int}}{?{int5:int}}{?:}{? }{?{word4:word}}{? }{?{word5:word}}", "<{int1:int}>{?{word1:word}}{? }{?{word2:word}}{?{rest1:rest}}", "{timestamp:timestamp}{? }", "{?<}{int1:int}"]

[[timestamp]]
field = "timestamp"
format = "auto"
