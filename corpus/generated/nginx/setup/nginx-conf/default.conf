server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 512k;
    client_header_timeout 5s;

    location = / {
        return 200 "ok home\n";
    }
    location /ok {
        return 200 "ok\n";
    }
    location /old {
        return 301 /new;
    }
    location /new {
        return 200 "moved target\n";
    }
    location /missing {
        return 404;
    }
    location /boom {
        return 500;
    }
    location /api/ {
        return 200 "{\"status\":\"ok\"}\n";
    }
    location /upload {
        # exercise POST/PUT logging with varied bytes
        return 200 "received\n";
    }
    location /slow {
        return 200 "slow ok\n";
    }
    # deliberately no location for /admin* -> falls through to 404
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    location / {
        return 200 "tls ok\n";
    }
}
