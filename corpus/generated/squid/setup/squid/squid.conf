# ULPF corpus generation — Squid forward proxy config.
# Base image: docker.io/ubuntu/squid:latest (Squid 6.13, Ubuntu 24.04 package build).
# access_log uses the built-in "squid" logformat (the ULPF squid_access parser's
# native format), NOT combined/common. That built-in format is compiled into
# squid regardless of this file; we reference it by name.

acl localnet src 0.0.0.1-0.255.255.255
acl localnet src 10.0.0.0/8
acl localnet src 100.64.0.0/10
acl localnet src 169.254.0.0/16
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 1025-65535
acl Safe_ports port 280
acl Safe_ports port 488
acl Safe_ports port 591
acl Safe_ports port 777
acl CONNECT method CONNECT

# Deliberately blocked destinations, used to generate TCP_DENIED lines.
acl blocked_sites dstdomain .blocked.test .denied.test .adtracker.test

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_sites
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

http_port 3128

# Small memory + disk cache so repeat requests actually produce
# TCP_MEM_HIT / TCP_HIT instead of always TCP_MISS.
cache_mem 16 MB
maximum_object_size_in_memory 512 KB
cache_dir ufs /var/spool/squid 100 16 256
maximum_object_size 10 MB
minimum_object_size 0 KB

refresh_pattern -i \.(css|js|png|jpg|jpeg|gif|txt|json)$ 1440 50% 20160 override-expire ignore-no-cache
refresh_pattern .		0	20%	4320

access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 0

coredump_dir /var/spool/squid
