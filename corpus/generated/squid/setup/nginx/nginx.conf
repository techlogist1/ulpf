# ULPF corpus generation — origin server behind the Squid proxy.
# Base: docker.io/library/nginx:alpine.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /error500 {
        return 500;
    }

    location = /error404 {
        return 404;
    }

    location /api/ {
        add_header Cache-Control "no-store";
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~* \.(css|js|png|txt|json)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
