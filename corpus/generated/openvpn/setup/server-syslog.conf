# Identical to server.conf except the log destination: OpenVPN's own --syslog
# path instead of --log-append, so rsyslog in the same container frames every
# line as RFC 3164 ("Mon DD HH:MM:SS host openvpn[pid]: ...").
port 1194
proto udp
dev tun

ca /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/server.crt
key /etc/openvpn/certs/server.key
dh /etc/openvpn/certs/dh.pem
tls-auth /etc/openvpn/certs/ta.key 0
crl-verify /etc/openvpn/certs/crl.pem

topology subnet
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp.txt

keepalive 5 15
tls-timeout 5
hand-window 8
connect-freq 60 10
reneg-sec 60

cipher AES-256-GCM
auth SHA256

persist-key
persist-tun

status /var/log/openvpn/status.log 3
syslog
verb 3
mute 0
explicit-exit-notify 1
