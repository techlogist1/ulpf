# Minimal container rsyslog: read the local socket, write the traditional
# RFC 3164 file format (this is what the syslog-framed OpenVPN lines seen in
# the wild look like). No imklog (no /proc/kmsg in a container), no network.
module(load="imuxsock")
$FileOwner root
$FileGroup root
$FileCreateMode 0644
$DirCreateMode 0755
$Umask 0022
$WorkDirectory /var/spool/rsyslog
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
*.* /var/log/openvpn/syslog
