# Failure mode: valid identity and keys, but pointed at a port nothing is
# listening on (server only binds 1194/udp) -> repeated "TLS Error: TLS
# key negotiation failed to occur within 5 seconds" with no response at all
# from the peer, forever retried (connect-retry-max 0).
client
dev tun
proto udp
remote ulpf-ovpn-server 11940
resolv-retry infinite
nobind
persist-key
persist-tun

ca /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/olduser.crt
key /etc/openvpn/certs/olduser.key
tls-auth /etc/openvpn/certs/ta.key 1

remote-cert-tls server
cipher AES-256-GCM
auth SHA256

connect-retry 1 2
connect-retry-max 0
connect-timeout 5
tls-timeout 5
hand-window 8

log-append /var/log/openvpn/client.log
verb 3
explicit-exit-notify 1
