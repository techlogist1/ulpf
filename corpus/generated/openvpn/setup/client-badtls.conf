# Failure mode: valid cert/CA, but the tls-auth static key on disk at
# /etc/openvpn/certs/ta.key does NOT match the server's -> HMAC authentication
# failure on the control channel, TLS handshake never gets far enough to
# reach certificate verification.
client
dev tun
proto udp
remote ulpf-ovpn-server 1194
resolv-retry infinite
nobind
persist-key
persist-tun

ca /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/jdoe.crt
key /etc/openvpn/certs/jdoe.key
tls-auth /etc/openvpn/certs/ta.key 1

remote-cert-tls server
cipher AES-256-GCM
auth SHA256

connect-retry 1 2
connect-retry-max 0
connect-timeout 5
tls-timeout 5
hand-window 8

log-append /var/log/openvpn/client.log
verb 3
explicit-exit-notify 1
