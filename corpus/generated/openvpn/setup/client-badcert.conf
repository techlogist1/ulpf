# Failure mode: client presents a certificate signed by a CA the server does
# not trust ("Rogue Test CA", not "ULPF Test CA") -> VERIFY ERROR: unable to
# get local issuer certificate.
client
dev tun
proto udp
remote ulpf-ovpn-server 1194
resolv-retry infinite
nobind
persist-key
persist-tun

ca /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/mallory.crt
key /etc/openvpn/certs/mallory.key
tls-auth /etc/openvpn/certs/ta.key 1

remote-cert-tls server
cipher AES-256-GCM
auth SHA256

connect-retry 1 2
connect-retry-max 0
connect-timeout 5
tls-timeout 5
hand-window 8

log-append /var/log/openvpn/client.log
verb 3
explicit-exit-notify 1
