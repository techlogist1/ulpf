global
    log sysloglistener:514 local0 info
    maxconn 2000

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3
    option  redispatch

frontend fe_http
    bind *:80
    default_backend be_nginx

backend be_nginx
    balance roundrobin
    option httpchk GET /ok
    default-server check inter 2s fall 2 rise 2 resolvers docker init-addr none
    server nginx1 nginx1:80 check
    server nginx2 nginx2:80 check

frontend fe_tls
    mode tcp
    option tcplog
    bind *:443
    default_backend be_nginx_tls

backend be_nginx_tls
    mode tcp
    balance roundrobin
    default-server resolvers docker init-addr none
    server nginx1 nginx1:443 check
    server nginx2 nginx2:443 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node
