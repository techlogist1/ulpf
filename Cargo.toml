[workspace]
resolver = "2"
members = [
    "crates/ulpf-time",
    "crates/ulpf-store",
    "crates/ulpf-parse",
    "crates/ulpf-normalize",
    "crates/ulpf-infer",
    "crates/ulpf-parquet",
    "crates/ulpf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/techlogist1/ulpf"

[workspace.dependencies]
memmap2 = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
memchr = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
futures-util = "0.3"
libc = "0.2"
parquet = { version = "59.3.0", default-features = false, features = ["snap"] }

# Default profile: no LTO, default codegen units. A tester on any machine gets a
# working binary in under a minute; fat LTO with one codegen unit needed several GB
# of peak memory in the linker and failed on a 16 GB Windows box three times in four.
[profile.release]
lto = false
debug = 1

# What ships: the Docker image and every throughput number the harness reports. Exactly
# what [profile.release] carried before the split. CI's release assets and the sidecar
# build still use `cargo build --release` at this commit and move to `--profile dist`
# with lane 7C (lane-7b-app, in flight).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
