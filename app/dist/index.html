<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULPF</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #14171c; color: #d9dde3;
    font: 15px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-user-select: none; user-select: none;
  }
  main { text-align: center; width: min(32rem, 90vw); }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 6px;
    background: #2b3038; display: grid; place-items: center; gap: 5px; padding: 12px;
    box-sizing: border-box; grid-template-rows: repeat(3, 1fr);
  }
  .mark i { display: block; height: 4px; background: #e8ebef; border-radius: 2px; justify-self: start; }
  .mark i:nth-child(1) { width: 100%; }
  .mark i:nth-child(2) { width: 62%; }
  .mark i:nth-child(3) { width: 82%; }
  h1 { font-weight: 400; font-size: 20px; letter-spacing: .02em; margin: 0 0 6px; color: #f2f4f7; }
  /* A failure is a sentence, then the way out, then where its output is: one line each. */
  #msg { margin: 0; color: #9aa3ad; white-space: pre-line; }
  #msg.err { color: #f0b46b; }
  .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #9aa3ad; margin-left: 8px; vertical-align: middle; animation: pulse 1.4s ease-in-out infinite; }
  #msg.err .pulse { display: none; }
  @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .7 } }
  .hint { margin-top: 28px; font-size: 13px; color: #6f7883; }
  /* The one recovery button: shown whenever the shell asks for it, which is on every
     failure it can show. Nothing else on this page is clickable. */
  #act, .choices button { padding: 8px 18px; border-radius: 7px;
    border: 1px solid #4a545f; background: #262b33; color: #f2f4f7; font: inherit; font-size: 14px;
    cursor: pointer; }
  #act:hover, .choices button:hover { background: #2e343d; }
  #act:focus-visible, .choices button:focus-visible { outline: 2px solid #f0b46b; outline-offset: 2px; }
  #act:disabled, .choices button:disabled { opacity: .5; cursor: default; }
  #act { display: none; margin: 18px auto 0; }
  #act.on { display: block; }
  /* Reset: three buttons, the one that changes nothing last and quiet. */
  .choices { display: none; margin: 22px auto 0; flex-direction: column; align-items: center; gap: 10px; }
  .choices.on { display: flex; }
  .choices .quiet { border-color: transparent; background: none; color: #9aa3ad; }
  .choices .quiet:hover { background: #1c2028; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>ULPF</h1>
  <p id="msg">Starting the engine<span class="pulse"></span></p>
  <button id="act" type="button">Start again</button>
  <div class="choices" id="choices">
    <button id="reset-keep" type="button">Reset events, keep approved parsers</button>
    <button id="reset-all" type="button">Reset to first launch</button>
    <button id="reset-cancel" class="quiet" type="button">Cancel</button>
  </div>
  <p class="hint" id="hint">Drop log files or folders anywhere in this window once the feed is up.</p>
</main>
<script>
  // The shell puts the status line in the URL fragment: "#text", "#!text" for an error, and
  // a page whose buttons act carries a flag after the "!": "#!+text" for Start again,
  // "#!*text" for a store another writer holds, where the button stops that writer first,
  // and "#?text" for the reset choice page, which is a question and not a failure. A
  // fragment change on the loaded page updates it in place, so no reload and no race.
  var label = 'Start again';
  function show() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (!h) return;
    var err = h[0] === '!';
    if (err) h = h.slice(1);
    var reset = h[0] === '?';
    var act = h[0] === '+' || h[0] === '*';
    if (act) { label = h[0] === '*' ? 'Stop it and start again' : 'Start again'; }
    if (act || reset) h = h.slice(1);
    var m = document.getElementById('msg');
    m.textContent = h;
    m.className = err ? 'err' : '';
    // The pulse says the shell is waiting on something. A question is waiting on the user.
    if (!err && !reset) { var s = document.createElement('span'); s.className = 'pulse'; m.appendChild(s); }
    var b = document.getElementById('act');
    b.className = act ? 'on' : '';
    b.textContent = label;
    b.disabled = false;
    document.getElementById('choices').className = reset ? 'choices on' : 'choices';
    // Nothing can be dropped on a window with no engine behind it, and nothing should be
    // dropped into one that is about to be emptied.
    document.getElementById('hint').hidden = err || reset;
  }
  // The shell's one command. It stops the process holding the store if there is one and
  // starts the engine again through the ordinary start path, which navigates this page
  // onward when it answers.
  document.getElementById('act').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    b.textContent = 'Starting…';
    window.__TAURI__.core.invoke('stop_holder').catch(function (e) {
      b.disabled = false;
      b.textContent = label;
      document.getElementById('msg').textContent = String(e);
    });
  });
  // The reset choice page. Each button is one command; the shell stops the engine, removes
  // what the choice names and starts again, which navigates this page onward. Cancel
  // touches nothing and puts back the page this one covered.
  function choose(id, cmd, args, working) {
    document.getElementById(id).addEventListener('click', function () {
      var b = this;
      var siblings = document.querySelectorAll('#choices button');
      for (var i = 0; i < siblings.length; i++) siblings[i].disabled = true;
      if (working) b.textContent = working;
      window.__TAURI__.core.invoke(cmd, args).catch(function (e) {
        for (var i = 0; i < siblings.length; i++) siblings[i].disabled = false;
        document.getElementById('msg').textContent = String(e);
      });
    });
  }
  choose('reset-keep', 'reset', { keep: true }, 'Resetting…');
  choose('reset-all', 'reset', { keep: false }, 'Resetting…');
  choose('reset-cancel', 'reset_cancel', {});

  addEventListener('hashchange', show);
  show();
</script>
</body>
</html>
