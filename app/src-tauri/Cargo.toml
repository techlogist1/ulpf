[package]
name = "ulpf-app"
version = "0.1.0"
description = "ULPF desktop shell: starts the engine, shows its UI, takes dropped logs"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace root: the engine's root workspace lists its members explicitly and
# must not pick this package up, and this package must not resolve to that root.
[workspace]

[lib]
name = "ulpf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"

# The job object that reaps the engine when the app is force-killed (src/job.rs). Pinned to
# the major tauri's own tree already resolves (windows-sys 0.61.2 in Cargo.lock), so this
# adds no crate to the build. Win32_Security is in the list because CreateJobObjectW takes
# a SECURITY_ATTRIBUTES pointer and windows-sys gates the declaration on that feature;
# Win32_System_Threading because JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds IO_COUNTERS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
